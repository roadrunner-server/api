syntax = "proto3";

package redis.v1;

option go_package = "github.com/roadrunner-server/api-go/v6/redis/v1;redisV1";
option php_metadata_namespace = "RoadRunner\\Redis\\DTO\\V1\\GPBMetadata";
option php_namespace = "RoadRunner\\Redis\\DTO\\V1";

// Shared replies

message Empty {}

message IntReply {
  int64 value = 1;
}

message FloatReply {
  double value = 1;
}

message BoolReply {
  bool value = 1;
}

message StringReply {
  string value = 1;
}

// value is absent when Redis replies nil.
message BytesReply {
  optional bytes value = 1;
}

// value is absent when Redis replies nil.
message OptionalIntReply {
  optional int64 value = 1;
}

// value is absent when Redis replies nil.
message OptionalFloatReply {
  optional double value = 1;
}

// found is filled by MGet and HMGet only: found[i] is false when values[i] is a nil reply.
message BytesListReply {
  repeated bytes values = 1;
  repeated bool found = 2;
}

message BoolListReply {
  repeated bool values = 1;
}

message MapReply {
  map<string, bytes> values = 1;
}

message ScoredMember {
  bytes member = 1;
  double score = 2;
}

message ScoredMembersReply {
  repeated ScoredMember members = 1;
}

message ScanReply {
  uint64 cursor = 1;
  repeated string keys = 2;
}

// Strings and counters

message GetRequest {
  string key = 1;
}

// ex is the TTL in seconds, px in milliseconds. nx and xx are mutually exclusive.
message SetRequest {
  string key = 1;
  bytes value = 2;
  optional int64 ex = 3;
  optional int64 px = 4;
  bool nx = 5;
  bool xx = 6;
  bool keep_ttl = 7;
}

message MGetRequest {
  repeated string keys = 1;
}

message MSetRequest {
  map<string, bytes> values = 1;
}

message GetDelRequest {
  string key = 1;
}

message AppendRequest {
  string key = 1;
  bytes value = 2;
}

message StrLenRequest {
  string key = 1;
}

message IncrRequest {
  string key = 1;
}

message IncrByRequest {
  string key = 1;
  int64 increment = 2;
}

message IncrByFloatRequest {
  string key = 1;
  double increment = 2;
}

message DecrRequest {
  string key = 1;
}

message DecrByRequest {
  string key = 1;
  int64 decrement = 2;
}

// Keys

message DelRequest {
  repeated string keys = 1;
}

message UnlinkRequest {
  repeated string keys = 1;
}

message ExistsRequest {
  repeated string keys = 1;
}

message ExpireRequest {
  string key = 1;
  int64 seconds = 2;
}

message PExpireRequest {
  string key = 1;
  int64 milliseconds = 2;
}

message ExpireAtRequest {
  string key = 1;
  int64 unix_seconds = 2;
}

message TTLRequest {
  string key = 1;
}

message PTTLRequest {
  string key = 1;
}

message PersistRequest {
  string key = 1;
}

message TypeRequest {
  string key = 1;
}

message RenameRequest {
  string key = 1;
  string new_key = 2;
}

// match is a glob pattern, count a hint, type filters by key type. Empty values are not sent.
message ScanRequest {
  uint64 cursor = 1;
  string match = 2;
  int64 count = 3;
  string type = 4;
}

// Hashes

message HSetRequest {
  string key = 1;
  map<string, bytes> fields = 2;
}

message HSetNXRequest {
  string key = 1;
  string field = 2;
  bytes value = 3;
}

message HGetRequest {
  string key = 1;
  string field = 2;
}

message HMGetRequest {
  string key = 1;
  repeated string fields = 2;
}

message HGetAllRequest {
  string key = 1;
}

message HDelRequest {
  string key = 1;
  repeated string fields = 2;
}

message HExistsRequest {
  string key = 1;
  string field = 2;
}

message HLenRequest {
  string key = 1;
}

message HKeysRequest {
  string key = 1;
}

message HValsRequest {
  string key = 1;
}

message HIncrByRequest {
  string key = 1;
  string field = 2;
  int64 increment = 3;
}

message HIncrByFloatRequest {
  string key = 1;
  string field = 2;
  double increment = 3;
}

// Lists

message LPushRequest {
  string key = 1;
  repeated bytes elements = 2;
}

message RPushRequest {
  string key = 1;
  repeated bytes elements = 2;
}

// count 0 pops one element.
message LPopRequest {
  string key = 1;
  int64 count = 2;
}

// count 0 pops one element.
message RPopRequest {
  string key = 1;
  int64 count = 2;
}

message LRangeRequest {
  string key = 1;
  int64 start = 2;
  int64 stop = 3;
}

message LLenRequest {
  string key = 1;
}

message LIndexRequest {
  string key = 1;
  int64 index = 2;
}

message LSetRequest {
  string key = 1;
  int64 index = 2;
  bytes element = 3;
}

message LRemRequest {
  string key = 1;
  int64 count = 2;
  bytes element = 3;
}

message LTrimRequest {
  string key = 1;
  int64 start = 2;
  int64 stop = 3;
}

// where_from and where_to are LEFT or RIGHT.
message LMoveRequest {
  string source = 1;
  string destination = 2;
  string where_from = 3;
  string where_to = 4;
}

// Sets

message SAddRequest {
  string key = 1;
  repeated bytes members = 2;
}

message SRemRequest {
  string key = 1;
  repeated bytes members = 2;
}

message SMembersRequest {
  string key = 1;
}

message SIsMemberRequest {
  string key = 1;
  bytes member = 2;
}

message SMIsMemberRequest {
  string key = 1;
  repeated bytes members = 2;
}

message SCardRequest {
  string key = 1;
}

message SPopRequest {
  string key = 1;
}

message SPopNRequest {
  string key = 1;
  int64 count = 2;
}

message SRandMemberRequest {
  string key = 1;
}

message SRandMemberNRequest {
  string key = 1;
  int64 count = 2;
}

message SDiffRequest {
  repeated string keys = 1;
}

message SInterRequest {
  repeated string keys = 1;
}

message SUnionRequest {
  repeated string keys = 1;
}

// Sorted sets

message ZAddRequest {
  string key = 1;
  repeated ScoredMember members = 2;
  bool nx = 3;
  bool xx = 4;
  bool gt = 5;
  bool lt = 6;
  bool ch = 7;
}

message ZRemRequest {
  string key = 1;
  repeated bytes members = 2;
}

message ZScoreRequest {
  string key = 1;
  bytes member = 2;
}

message ZIncrByRequest {
  string key = 1;
  double increment = 2;
  bytes member = 3;
}

message ZCardRequest {
  string key = 1;
}

// min and max are score strings: -inf, +inf, 10, (1.5
message ZCountRequest {
  string key = 1;
  string min = 2;
  string max = 3;
}

message ZRankRequest {
  string key = 1;
  bytes member = 2;
}

message ZRevRankRequest {
  string key = 1;
  bytes member = 2;
}

// start and stop are index strings by default, score strings (-inf, (1.5, 10) with by_score,
// lex strings (-, +, [a, (b) with by_lex. LIMIT offset count is sent when offset or count is not 0.
message ZRangeRequest {
  string key = 1;
  string start = 2;
  string stop = 3;
  bool by_score = 4;
  bool by_lex = 5;
  bool rev = 6;
  int64 offset = 7;
  int64 count = 8;
  bool with_scores = 9;
}

// count 0 pops one member.
message ZPopMinRequest {
  string key = 1;
  int64 count = 2;
}

// count 0 pops one member.
message ZPopMaxRequest {
  string key = 1;
  int64 count = 2;
}

message ZRemRangeByRankRequest {
  string key = 1;
  int64 start = 2;
  int64 stop = 3;
}

// min and max are score strings: -inf, +inf, 10, (1.5
message ZRemRangeByScoreRequest {
  string key = 1;
  string min = 2;
  string max = 3;
}
